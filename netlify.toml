[build]
  publish = "."
  command = "echo 'Static site ready for deployment'"

[[redirects]]
  from = "/tours.html"
  to = "/experience.html"
  status = 301

[[redirects]]
  from = "/tour.html"
  to = "/events.html"
  status = 301

[[redirects]]
  from = "/journal.html"
  to = "/partners.html"
  status = 301

[[redirects]]
  from = "/destinations.html"
  to = "/zones.html"
  status = 301

[[redirects]]
  from = "/article.html"
  to = "/guide.html"
  status = 301

[[redirects]]
  from = "/post.html"
  to = "/guide.html"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
